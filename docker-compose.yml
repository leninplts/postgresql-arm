version: "3.8"
services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postgres-vector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pgvector_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Kx9#mP2vL7qR4wYn}
      POSTGRES_DB: ${POSTGRES_DB:-vectordb}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5433:5432"
    restart: unless-stopped

volumes:
  pgdata:
